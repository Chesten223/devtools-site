<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator</title>
<meta name="description" content="Generate MD5, SHA-1, SHA-256, SHA-512 hashes from text or files.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;padding:1rem;min-height:100vh}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:.25rem}
.subtitle{color:#9ca3af;font-size:.9rem;margin-bottom:1.5rem}
.card{background:#111827;border:1px solid #1f2937;border-radius:.75rem;padding:1.25rem;margin-bottom:1rem}
label{display:block;font-size:.85rem;color:#9ca3af;margin-bottom:.35rem;font-weight:500}
textarea,input[type=text]{width:100%;background:#0a0a0a;border:1px solid #1f2937;border-radius:.5rem;color:#e5e7eb;padding:.6rem .75rem;font-family:inherit;font-size:.9rem;resize:vertical;transition:border-color .15s}
textarea:focus,input[type=text]:focus{outline:none;border-color:#22c55e}
textarea{min-height:100px}
.input-row{display:flex;gap:.75rem;margin-bottom:.75rem}
.input-row .field{flex:1}
.input-row .field.hmac-field{flex:0 0 280px}
button{background:#22c55e;color:#0a0a0a;border:none;border-radius:.5rem;padding:.55rem 1.1rem;font-weight:600;font-size:.85rem;cursor:pointer;transition:background .15s}
button:hover{background:#16a34a}
button:active{background:#15803d}
button.secondary{background:transparent;color:#22c55e;border:1px solid #22c55e}
button.secondary:hover{background:rgba(34,197,94,.1)}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.hash-results{display:none;margin-top:1rem}
.hash-row{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.6rem;padding:.5rem;background:#0a0a0a;border-radius:.5rem}
.hash-label{flex:0 0 70px;font-weight:600;font-size:.8rem;color:#22c55e;padding-top:.2rem}
.hash-value{flex:1;font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:.78rem;word-break:break-all;color:#d1d5db;user-select:all;padding-top:.2rem}
.copy-btn{flex:0 0 auto;background:transparent;color:#9ca3af;border:1px solid #374151;padding:.25rem .55rem;font-size:.75rem;border-radius:.375rem;cursor:pointer;transition:all .15s}
.copy-btn:hover{color:#22c55e;border-color:#22c55e}
.copy-btn.copied{color:#22c55e;border-color:#22c55e}
.diff-section{margin-top:1rem}
.diff-section h3{font-size:.95rem;color:#fff;margin-bottom:.5rem}
.diff-inputs{display:flex;gap:.75rem;margin-bottom:.5rem}
.diff-inputs .field{flex:1}
.diff-inputs input{width:100%;font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:.78rem}
.diff-result{display:none;padding:.75rem;background:#0a0a0a;border-radius:.5rem;font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:.78rem;word-break:break-all;line-height:1.8}
.diff-result .match{color:#22c55e}
.diff-result .mismatch{color:#ef4444;background:rgba(239,68,68,.1);border-radius:2px;padding:0 1px}
.drop-zone{border:2px dashed #1f2937;border-radius:.75rem;padding:2rem;text-align:center;color:#6b7280;transition:all .2s;cursor:pointer;margin-bottom:1rem}
.drop-zone.dragover{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.05)}
.drop-zone p{font-size:.9rem}
.drop-zone .hint{font-size:.75rem;color:#4b5563;margin-top:.25rem}
.file-name{display:none;color:#22c55e;font-size:.8rem;margin-top:.4rem}
@media(max-width:600px){
  .input-row{flex-direction:column}
  .input-row .field.hmac-field{flex:1}
  .diff-inputs{flex-direction:column}
  .hash-label{flex:0 0 55px;font-size:.72rem}
}
</style>
</head>
<body>
<div class="container">
  <h1>Hash Generator</h1>
  <p class="subtitle">Generate MD5, SHA-1, SHA-256, SHA-512 hashes from text or files.</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <p>Drop a file here to hash it</p>
      <p class="hint">or click to browse &middot; or use the text input below</p>
      <p class="file-name" id="fileName"></p>
    </div>

    <div class="input-row">
      <div class="field">
        <label for="inputText">Input Text</label>
        <textarea id="inputText" placeholder="Enter text to hash..."></textarea>
      </div>
    </div>

    <div class="input-row">
      <div class="field hmac-field">
        <label for="hmacKey">HMAC Secret Key (optional)</label>
        <input type="text" id="hmacKey" placeholder="Leave empty for plain hash">
      </div>
    </div>

    <div class="actions">
      <button id="generateBtn" type="button">Generate Hashes</button>
      <button id="clearBtn" type="button" class="secondary">Clear</button>
      <button id="exportBtn" type="button" class="secondary">Export Results</button>
    </div>

    <div class="hash-results" id="hashResults">
      <div class="hash-row">
        <span class="hash-label">MD5</span>
        <span class="hash-value" id="hashMD5"></span>
        <button class="copy-btn" data-target="hashMD5" type="button">Copy</button>
      </div>
      <div class="hash-row">
        <span class="hash-label">SHA-1</span>
        <span class="hash-value" id="hashSHA1"></span>
        <button class="copy-btn" data-target="hashSHA1" type="button">Copy</button>
      </div>
      <div class="hash-row">
        <span class="hash-label">SHA-256</span>
        <span class="hash-value" id="hashSHA256"></span>
        <button class="copy-btn" data-target="hashSHA256" type="button">Copy</button>
      </div>
      <div class="hash-row">
        <span class="hash-label">SHA-512</span>
        <span class="hash-value" id="hashSHA512"></span>
        <button class="copy-btn" data-target="hashSHA512" type="button">Copy</button>
      </div>
    </div>
  </div>

  <div class="card diff-section">
    <h3>Compare Two Hashes</h3>
    <div class="diff-inputs">
      <div class="field">
        <label for="diffA">Hash A</label>
        <input type="text" id="diffA" placeholder="Paste first hash...">
      </div>
      <div class="field">
        <label for="diffB">Hash B</label>
        <input type="text" id="diffB" placeholder="Paste second hash...">
      </div>
    </div>
    <button id="diffBtn" type="button">Compare</button>
    <div class="diff-result" id="diffResult"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // --- MD5 (RFC 1321) ---
  var md5 = (function(){
    function safeAdd(x, y) {
      var lsw = (x & 0xffff) + (y & 0xffff);
      var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
      return (msw << 16) | (lsw & 0xffff);
    }
    function bitRotateLeft(num, cnt) {
      return (num << cnt) | (num >>> (32 - cnt));
    }
    function md5cmn(q, a, b, x, s, t) {
      return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b);
    }
    function md5ff(a, b, c, d, x, s, t) {
      return md5cmn((b & c) | (~b & d), a, b, x, s, t);
    }
    function md5gg(a, b, c, d, x, s, t) {
      return md5cmn((b & d) | (c & ~d), a, b, x, s, t);
    }
    function md5hh(a, b, c, d, x, s, t) {
      return md5cmn(b ^ c ^ d, a, b, x, s, t);
    }
    function md5ii(a, b, c, d, x, s, t) {
      return md5cmn(c ^ (b | ~d), a, b, x, s, t);
    }
    function binlMD5(x, len) {
      x[len >> 5] |= 0x80 << (len % 32);
      x[((len + 64) >>> 9 << 4) + 14] = len;
      var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
      for (var i = 0; i < x.length; i += 16) {
        var oa = a, ob = b, oc = c, od = d;
        a = md5ff(a, b, c, d, x[i],     7, -680876936);
        d = md5ff(d, a, b, c, x[i+1],  12, -389564586);
        c = md5ff(c, d, a, b, x[i+2],  17,  606105819);
        b = md5ff(b, c, d, a, x[i+3],  22, -1044525330);
        a = md5ff(a, b, c, d, x[i+4],   7, -176418897);
        d = md5ff(d, a, b, c, x[i+5],  12,  1200080426);
        c = md5ff(c, d, a, b, x[i+6],  17, -1473231341);
        b = md5ff(b, c, d, a, x[i+7],  22, -45705983);
        a = md5ff(a, b, c, d, x[i+8],   7,  1770035416);
        d = md5ff(d, a, b, c, x[i+9],  12, -1958414417);
        c = md5ff(c, d, a, b, x[i+10], 17, -42063);
        b = md5ff(b, c, d, a, x[i+11], 22, -1990404162);
        a = md5ff(a, b, c, d, x[i+12],  7,  1804603682);
        d = md5ff(d, a, b, c, x[i+13], 12, -40341101);
        c = md5ff(c, d, a, b, x[i+14], 17, -1502002290);
        b = md5ff(b, c, d, a, x[i+15], 22,  1236535329);
        a = md5gg(a, b, c, d, x[i+1],   5, -165796510);
        d = md5gg(d, a, b, c, x[i+6],   9, -1069501632);
        c = md5gg(c, d, a, b, x[i+11], 14,  643717713);
        b = md5gg(b, c, d, a, x[i],    20, -373897302);
        a = md5gg(a, b, c, d, x[i+5],   5, -701558691);
        d = md5gg(d, a, b, c, x[i+10],  9,  38016083);
        c = md5gg(c, d, a, b, x[i+15], 14, -660478335);
        b = md5gg(b, c, d, a, x[i+4],  20, -405537848);
        a = md5gg(a, b, c, d, x[i+9],   5,  568446438);
        d = md5gg(d, a, b, c, x[i+14],  9, -1019803690);
        c = md5gg(c, d, a, b, x[i+3],  14, -187363961);
        b = md5gg(b, c, d, a, x[i+8],  20,  1163531501);
        a = md5gg(a, b, c, d, x[i+13],  5, -1444681467);
        d = md5gg(d, a, b, c, x[i+2],   9, -51403784);
        c = md5gg(c, d, a, b, x[i+7],  14,  1735328473);
        b = md5gg(b, c, d, a, x[i+12], 20, -1926607734);
        a = md5hh(a, b, c, d, x[i+5],   4, -378558);
        d = md5hh(d, a, b, c, x[i+8],  11, -2022574463);
        c = md5hh(c, d, a, b, x[i+11], 16,  1839030562);
        b = md5hh(b, c, d, a, x[i+14], 23, -35309556);
        a = md5hh(a, b, c, d, x[i+1],   4, -1530992060);
        d = md5hh(d, a, b, c, x[i+4],  11,  1272893353);
        c = md5hh(c, d, a, b, x[i+7],  16, -155497632);
        b = md5hh(b, c, d, a, x[i+10], 23, -1094730640);
        a = md5hh(a, b, c, d, x[i+13],  4,  681279174);
        d = md5hh(d, a, b, c, x[i],    11, -358537222);
        c = md5hh(c, d, a, b, x[i+3],  16, -722521979);
        b = md5hh(b, c, d, a, x[i+6],  23,  76029189);
        a = md5hh(a, b, c, d, x[i+9],   4, -640364487);
        d = md5hh(d, a, b, c, x[i+12], 11, -421815835);
        c = md5hh(c, d, a, b, x[i+15], 16,  530742520);
        b = md5hh(b, c, d, a, x[i+2],  23, -995338651);
        a = md5ii(a, b, c, d, x[i],     6, -198630844);
        d = md5ii(d, a, b, c, x[i+7],  10,  1126891415);
        c = md5ii(c, d, a, b, x[i+14], 15, -1416354905);
        b = md5ii(b, c, d, a, x[i+5],  21, -57434055);
        a = md5ii(a, b, c, d, x[i+12],  6,  1700485571);
        d = md5ii(d, a, b, c, x[i+3],  10, -1894986606);
        c = md5ii(c, d, a, b, x[i+10], 15, -1051523);
        b = md5ii(b, c, d, a, x[i+1],  21, -2054922799);
        a = md5ii(a, b, c, d, x[i+8],   6,  1873313359);
        d = md5ii(d, a, b, c, x[i+15], 10, -30611744);
        c = md5ii(c, d, a, b, x[i+6],  15, -1560198380);
        b = md5ii(b, c, d, a, x[i+13], 21,  1309151649);
        a = md5ii(a, b, c, d, x[i+4],   6, -145523070);
        d = md5ii(d, a, b, c, x[i+11], 10, -1120210379);
        c = md5ii(c, d, a, b, x[i+2],  15,  718787259);
        b = md5ii(b, c, d, a, x[i+9],  21, -343485551);
        a = safeAdd(a, oa); b = safeAdd(b, ob);
        c = safeAdd(c, oc); d = safeAdd(d, od);
      }
      return [a, b, c, d];
    }
    function str2binl(str) {
      var bin = [], mask = (1 << 8) - 1;
      for (var i = 0; i < str.length * 8; i += 8) {
        bin[i >> 5] |= (str.charCodeAt(i / 8) & mask) << (i % 32);
      }
      return bin;
    }
    function binl2hex(binarray) {
      var hexTab = "0123456789abcdef", str = "";
      for (var i = 0; i < binarray.length * 4; i++) {
        str += hexTab.charAt((binarray[i >> 2] >> ((i % 4) * 8 + 4)) & 0xf) +
               hexTab.charAt((binarray[i >> 2] >> ((i % 4) * 8)) & 0xf);
      }
      return str;
    }
    return function md5(s) {
      return binl2hex(binlMD5(str2binl(s), s.length * 8));
    };
  })();

  // --- UTF-8 safe MD5 ---
  function md5Utf8(str) {
    return md5(unescape(encodeURIComponent(str)));
  }

  // --- Crypto helpers ---
  function ab2hex(buf) {
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  function sha(algo, data) {
    var buf = typeof data === "string" ? new TextEncoder().encode(data) : data;
    return crypto.subtle.digest(algo, buf).then(ab2hex);
  }

  function hmacSha(algo, key, data) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(key), { name: "HMAC", hash: { name: algo } }, false, ["sign"])
      .then(function(cryptoKey) {
        return crypto.subtle.sign("HMAC", cryptoKey, enc.encode(data));
      }).then(ab2hex);
  }

  // HMAC-MD5 using the standard HMAC construction
  function hmacMd5(key, data) {
    var enc = new TextEncoder();
    var keyBytes = enc.encode(key);
    if (keyBytes.length > 64) {
      key = md5Utf8(key);
      keyBytes = enc.encode(key);
    }
    var kPad = new Uint8Array(64);
    kPad.set(keyBytes);
    var ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (var i = 0; i < 64; i++) {
      ipad[i] = kPad[i] ^ 0x36;
      opad[i] = kPad[i] ^ 0x5c;
    }
    var dataBytes = enc.encode(data);
    var innerInput = new Uint8Array(64 + dataBytes.length);
    innerInput.set(ipad);
    innerInput.set(dataBytes, 64);
    var innerStr = "";
    for (var j = 0; j < innerInput.length; j++) innerStr += String.fromCharCode(innerInput[j]);
    var innerHash = md5(innerStr);
    var outerInput = new Uint8Array(64 + innerHash.length);
    outerInput.set(opad);
    for (var k = 0; k < innerHash.length; k++) outerInput[64 + k] = innerHash.charCodeAt(k);
    var outerStr = "";
    for (var m = 0; m < outerInput.length; m++) outerStr += String.fromCharCode(outerInput[m]);
    return md5(outerStr);
  }

  // --- DOM ---
  var $ = function(id) { return document.getElementById(id); };
  var inputText = $("inputText"), hmacKeyEl = $("hmacKey"), results = $("hashResults");
  var hMD5 = $("hashMD5"), hSHA1 = $("hashSHA1"), hSHA256 = $("hashSHA256"), hSHA512 = $("hashSHA512");
  var dropZone = $("dropZone"), fileNameEl = $("fileName");
  var fileData = null;

  // --- File drag & drop ---
  dropZone.addEventListener("dragover", function(e) {
    e.preventDefault(); dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", function() {
    dropZone.classList.remove("dragover");
  });
  dropZone.addEventListener("drop", function(e) {
    e.preventDefault(); dropZone.classList.remove("dragover");
    var f = e.dataTransfer.files[0]; if (!f) return;
    fileData = f; fileNameEl.textContent = f.name; fileNameEl.style.display = "block";
    inputText.value = ""; inputText.placeholder = "Using file: " + f.name;
  });
  dropZone.addEventListener("click", function() {
    var inp = document.createElement("input"); inp.type = "file";
    inp.onchange = function() {
      if (!inp.files[0]) return;
      fileData = inp.files[0]; fileNameEl.textContent = fileData.name; fileNameEl.style.display = "block";
      inputText.value = ""; inputText.placeholder = "Using file: " + fileData.name;
    };
    inp.click();
  });

  // --- Generate ---
  $("generateBtn").addEventListener("click", function() {
    var key = hmacKeyEl.value.trim();
    var inputStr = inputText.value;

    if (fileData) {
      fileData.arrayBuffer().then(function(buf) {
        var bytes = new Uint8Array(buf);
        var str = "";
        for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
        var md5Val = key ? hmacMd5(key, str) : md5(str);
        hMD5.textContent = md5Val;
        var p1 = key ? hmacSha("SHA-1", key, str) : sha("SHA-1", buf);
        var p2 = key ? hmacSha("SHA-256", key, str) : sha("SHA-256", buf);
        var p3 = key ? hmacSha("SHA-512", key, str) : sha("SHA-512", buf);
        Promise.all([p1, p2, p3]).then(function(v) {
          hSHA1.textContent = v[0]; hSHA256.textContent = v[1]; hSHA512.textContent = v[2];
          results.style.display = "block";
        });
      });
    } else {
      if (!inputStr) return;
      var md5Val = key ? hmacMd5(key, inputStr) : md5Utf8(inputStr);
      hMD5.textContent = md5Val;
      var p1 = key ? hmacSha("SHA-1", key, inputStr) : sha("SHA-1", inputStr);
      var p2 = key ? hmacSha("SHA-256", key, inputStr) : sha("SHA-256", inputStr);
      var p3 = key ? hmacSha("SHA-512", key, inputStr) : sha("SHA-512", inputStr);
      Promise.all([p1, p2, p3]).then(function(v) {
        hSHA1.textContent = v[0]; hSHA256.textContent = v[1]; hSHA512.textContent = v[2];
        results.style.display = "block";
      });
    }
  });

  // --- Clear ---
  $("clearBtn").addEventListener("click", function() {
    inputText.value = ""; hmacKeyEl.value = ""; fileData = null;
    inputText.placeholder = "Enter text to hash...";
    fileNameEl.style.display = "none"; fileNameEl.textContent = "";
    results.style.display = "none";
    hMD5.textContent = hSHA1.textContent = hSHA256.textContent = hSHA512.textContent = "";
    $("diffA").value = ""; $("diffB").value = ""; $("diffResult").style.display = "none";
  });

  // --- Copy ---
  document.querySelectorAll(".copy-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var el = $(btn.dataset.target);
      if (!el.textContent) return;
      navigator.clipboard.writeText(el.textContent).then(function() {
        btn.textContent = "Copied!"; btn.classList.add("copied");
        setTimeout(function() { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1200);
      });
    });
  });

  // --- Export ---
  $("exportBtn").addEventListener("click", function() {
    if (!hMD5.textContent) return;
    var lines = [
      "MD5:     " + hMD5.textContent,
      "SHA-1:   " + hSHA1.textContent,
      "SHA-256: " + hSHA256.textContent,
      "SHA-512: " + hSHA512.textContent,
      "",
      "Input:   " + (fileData ? fileData.name : inputText.value.substring(0, 200)),
      "HMAC:    " + (hmacKeyEl.value.trim() ? "Yes" : "No"),
      "Generated: " + new Date().toISOString()
    ].join("\n");
    var blob = new Blob([lines], { type: "text/plain" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "hash-results.txt"; a.click(); URL.revokeObjectURL(a.href);
  });

  // --- Diff ---
  $("diffBtn").addEventListener("click", function() {
    var a = $("diffA").value.trim(), b = $("diffB").value.trim();
    var out = $("diffResult");
    if (!a || !b) {
      out.innerHTML = '<span style="color:#f59e0b">Please enter both hashes.</span>';
      out.style.display = "block"; return;
    }
    if (a === b) {
      out.innerHTML = '<span class="match">Hashes are identical.</span>';
      out.style.display = "block"; return;
    }
    var html = "";
    var len = Math.max(a.length, b.length);
    for (var i = 0; i < len; i++) {
      var ca = a[i] || "", cb = b[i] || "";
      if (ca.toLowerCase() === cb.toLowerCase()) {
        html += '<span class="match">' + cb + '</span>';
      } else {
        html += '<span class="mismatch">' + (cb || ca) + '</span>';
      }
    }
    out.innerHTML = html; out.style.display = "block";
  });
})();
</script>
</body>
</html>
